  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tract deserves a second look.<\u002Fh1>\n      <p style=\"font-size:clamp(17px,1.5vw,19px);line-height:1.6;color:#4A5A70;text-wrap:pretty;max-width:540px\">Before you sign your next employment contract, understand the terms that could affect your compensation, career and financial future. RedlineMD helps you spot hidden risks and negotiate with confidence.<\u002Fp>\n\n      <dl aria-label=\"Pricing comparison\" style=\"margin:4px 0 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid #E4E9F0;border-radius:12px;background:#FFFFFF;max-width:460px;overflow:hidden\">\n        <div style=\"padding:16px 18px;display:flex;flex-direction:column;gap:6px;border-right:1px solid #E4E9F0\">\n          <dt style=\"font-size:13px;color:#64748B;font-weight:500\">RedlineMD review<\u002Fdt>\n          <dd style=\"margin:0;font-size:32px;font-weight:600;letter-spacing:-0.03em;color:#172B46;line-height:1\">$199<\u002Fdd>\n        <\u002Fdiv>\n        <div style=\"padding:16px 18px;display:flex;flex-direction:column;gap:6px;background:#F7F9FC\">\n          <dt style=\"font-size:13px;color:#64748B;font-weight:500\">Traditional legal review<\u002Fdt>\n          <dd style=\"margin:0;font-size:32px;font-weight:500;letter-spacing:-0.03em;color:#64748B;line-height:1\">$500+<\u002Fdd>\n        <\u002Fdiv>\n      <\u002Fdl>\n\n      <div ref=\"{{ heroCtaRef }}\" style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:4px\">\n        <a href=\"{{ ctaUrl }}\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 24px;border-radius:10px;background:#C8282E;color:#FFFFFF;text-decoration:none;font-size:17px;font-weight:600;white-space:nowrap;flex:1 1 auto;box-shadow:0 1px 2px rgba(23,43,70,.12),0 8px 20px -8px rgba(200,40,46,.5);transition:background .15s\" style-hover=\"background:#A91F25;color:#FFFFFF\">Review my contract — $199\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m12 5 7 7-7 7\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n        <a href=\"#sample-report\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 22px;border-radius:10px;border:1px solid #CBD4E1;background:#FFFFFF;color:#172B46;text-decoration:none;font-size:17px;font-weight:500;white-space:nowrap;flex:1 1 auto;transition:border-color .15s\" style-hover=\"border-color:#172B46;color:#172B46\">See a sample report<\u002Fa>\n      <\u002Fdiv>\n      <p style=\"display:flex;align-items:center;gap:8px;font-size:14px;color:#64748B\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><polyline points=\"12 6 12 12 16 14\"><\u002Fpolyline><\u002Fsvg>\n        Contract analysis delivered within 24 hours\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <figure role=\"img\" aria-label=\"RedlineMD review interface showing a physician employment agreement with highlighted clauses, risk levels and a suggested revision for tail coverage\" style=\"margin:0;min-width:0\">\n      <div aria-hidden=\"true\" style=\"background:#FFFFFF;border:1px solid #E4E9F0;border-radius:14px;box-shadow:0 1px 2px rgba(23,43,70,.06),0 30px 60px -24px rgba(23,43,70,.28);overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:20px;padding:12px 16px;border-bottom:1px solid #E4E9F0\">\n          <img src=\"881e325a-1417-4033-aaf0-e0182a3371c6\" alt=\"\" style=\"height:13px;width:auto;display:block\">\n          <div style=\"display:flex;gap:16px;font-size:12px;color:#64748B;flex:1;min-width:0\">\n            <span>Dashboard<\u002Fspan><span style=\"color:#17243A;font-weight:500\">Contracts<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-size:11px;font-weight:500;border:1px solid #CBD4E1;border-radius:6px;padding:5px 9px;color:#17243A;white-space:nowrap\">Generate report<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin:12px 14px 0;display:flex;align-items:stretch;border:1px solid #E4E9F0;border-radius:8px;font-size:12px\">\n          <span style=\"padding:9px 12px;border-right:1px solid #E4E9F0;font-weight:600;color:#17243A;display:flex;align-items:center;white-space:nowrap\">Turn 1<\u002Fspan>\n          <div style=\"padding:7px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;flex:1\">\n            <span style=\"font-family:'Geist Mono',monospace;font-size:9.5px;letter-spacing:.06em;color:#64748B\">VIEWING<\u002Fspan>\n            <span style=\"color:#17243A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Physician employment agreement, Northside Health<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"display:flex;align-items:center;padding:0 12px;color:#64748B\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:18px 14px 76px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;line-height:1.6;color:#33435A\">\n          <div data-only=\"desktop\" style=\"display:grid;grid-template-columns:34px minmax(0,1fr) 44px;gap:8px;padding:8px 0;border-bottom:1px solid #F0F3F7\">\n            <span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#94A3B8;padding-top:2px\">2.1<\u002Fspan>\n            <p><b style=\"color:#17243A;font-weight:600\">Term.<\u002Fb> This Agreement begins on July 1, 2027 and continues for three (3) years.<\u002Fp>\n            <span style=\"justify-self:end;align-self:start;font-size:10px;font-weight:600;padding:3px 7px;border-radius:4px;background:#EEF2F6;color:#64748B\">OK<\u002Fspan>\n          <\u002Fdiv>\n          <div data-only=\"desktop\" style=\"display:grid;grid-template-columns:34px minmax(0,1fr) 44px;gap:8px;padding:8px 0;border-bottom:1px solid #F0F3F7\">\n            <span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#94A3B8;padding-top:2px\">4.2<\u002Fspan>\n            <p><b style=\"color:#17243A;font-weight:600\">Compensation.<\u002Fb> Annual base salary of $285,000. Productivity bonus is paid at <span style=\"background:#FFF1CF;border-bottom:2px solid #D9A026;padding:0 2px\">Employer's sole discretion<\u002Fspan>.<\u002Fp>\n            <span style=\"justify-self:end;align-self:start;font-size:10px;font-weight:600;padding:3px 7px;border-radius:4px;background:#FFF1CF;color:#8A5A00\">Med<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:34px minmax(0,1fr) 44px;gap:8px;padding:8px 0;border-bottom:1px solid #F0F3F7\">\n            <span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#94A3B8;padding-top:2px\">9.1<\u002Fspan>\n            <p><b style=\"color:#17243A;font-weight:600\">Restrictive covenant.<\u002Fb> Physician shall not practice within <span style=\"background:#FCE8E8;border-bottom:2px solid #D42A2F;padding:0 2px\">twenty-five (25) miles of any Employer facility<\u002Fspan> for two (2) years.<\u002Fp>\n            <span style=\"justify-self:end;align-self:start;font-size:10px;font-weight:600;padding:3px 7px;border-radius:4px;background:#FCE8E8;color:#B0232A\">High<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:34px minmax(0,1fr) 44px;gap:8px;padding:8px 0\">\n            <span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:#94A3B8;padding-top:2px\">11.4<\u002Fspan>\n            <p><b style=\"color:#17243A;font-weight:600\">Professional liability.<\u002Fb> Upon termination for any reason, <span style=\"background:#FCE8E8;border-bottom:2px solid #D42A2F;padding:0 2px\">Physician shall bear the cost of tail coverage<\u002Fspan>.<\u002Fp>\n            <span style=\"justify-self:end;align-self:start;font-size:10px;font-weight:600;padding:3px 7px;border-radius:4px;background:#FCE8E8;color:#B0232A\">High<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div aria-hidden=\"true\" style=\"position:relative;margin:-60px 16px 0 auto;width:calc(100% - 32px);max-width:360px;background:#FFFFFF;border:1px solid #E4E9F0;border-radius:12px;box-shadow:0 2px 4px rgba(23,43,70,.06),0 24px 40px -16px rgba(23,43,70,.3);overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #E4E9F0\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#D42A2F\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-size:14px;font-weight:600;color:#17243A;flex:1\">Risk alert<\u002Fspan>\n          <span style=\"font-family:'Geist Mono',monospace;font-size:10.5px;color:#64748B\">§11.4<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px\">\n          <p style=\"font-size:12.5px;line-height:1.55;color:#33435A\">Tail coverage is your cost even if the employer ends the contract without cause.<\u002Fp>\n          <div style=\"background:#F7F9FC;border:1px solid #E4E9F0;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:10.5px;font-weight:600;color:#64748B\">Suggested revision<\u002Fspan>\n            <p style=\"font-size:12px;line-height:1.55;color:#33435A\">If terminated without cause, <del style=\"color:#B0232A\">Physician shall bear<\u002Fdel> <ins style=\"color:#17703F;text-decoration:none;background:#E5F4EB;padding:0 2px\">Employer shall pay<\u002Fins> the cost of tail coverage.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ffigure>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contract-risks\" data-screen-label=\"02 Contract risks\" aria-labelledby=\"risks-title\" style=\"background:#172B46;color:#FFFFFF;scroll-margin-top:110px\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:clamp(64px,9vw,128px) clamp(20px,5vw,48px);display:flex;flex-direction:column;gap:clamp(40px,5vw,64px)\">\n    <div style=\"display:flex;flex-direction:column;gap:20px;max-width:720px\">\n      <div style=\"display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:#FF9C9C\">\n        <span style=\"width:20px;height:2px;background:#FF6B6B;display:block\"><\u002Fspan>\n        <span>What to look for<\u002Fspan>\n      <\u002Fdiv>\n      <h2 id=\"risks-title\" style=\"font-size:clamp(32px,4.2vw,52px);line-height:1.06;letter-spacing:-0.035em;font-weight:600;text-wrap:balance\">The biggest risks aren't always obvious.<\u002Fh2>\n      <p style=\"font-size:clamp(17px,1.5vw,19px);line-height:1.6;color:#C3CDDB;text-wrap:pretty\">A physician employment contract is more than a salary agreement. The details can affect what you earn, what you owe and where you can work next.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px\">\n      <article style=\"border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.035);border-radius:14px;padding:clamp(24px,2.6vw,32px);display:flex;flex-direction:column;gap:16px\">\n        <span style=\"width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;color:#FF8A8A\">\n          <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"><\u002Fpath><path d=\"M12 8v4\"><\u002Fpath><path d=\"M12 16h.01\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <h3 style=\"font-size:21px;line-height:1.25;letter-spacing:-0.02em;font-weight:600;margin-top:8px\">Tail insurance costs<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.6;color:#C3CDDB;text-wrap:pretty\">Some contracts leave you responsible for malpractice coverage after you leave a job. Depending on your policy, that expense can exceed $10,000.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.035);border-radius:14px;padding:clamp(24px,2.6vw,32px);display:flex;flex-direction:column;gap:16px\">\n        <span style=\"width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;color:#FF8A8A\">\n          <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fspan>\n        <h3 style=\"font-size:21px;line-height:1.25;letter-spacing:-0.02em;font-weight:600;margin-top:8px\">Non-compete restrictions<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.6;color:#C3CDDB;text-wrap:pretty\">Certain terms may limit where you can practice after leaving an employer. Understanding those restrictions before signing matters.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.035);border-radius:14px;padding:clamp(24px,2.6vw,32px);display:flex;flex-direction:column;gap:16px\">\n        <span style=\"width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;color:#FF8A8A\">\n          <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect width=\"20\" height=\"12\" x=\"2\" y=\"6\" rx=\"2\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"2\"><\u002Fcircle><path d=\"M6 12h.01M18 12h.01\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <h3 style=\"font-size:21px;line-height:1.25;letter-spacing:-0.02em;font-weight:600;margin-top:8px\">Compensation and termination terms<\u002Fh3>\n        <p style=\"font-size:16px;line-height:1.6;color:#C3CDDB;text-wrap:pretty\">Bonus structures, repayment obligations and exit conditions can change the real value of an otherwise attractive offer.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n\n    <dl aria-label=\"Cost comparison\" style=\"margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1px;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.14);border-radius:14px;overflow:hidden\">\n      <div style=\"background:#172B46;padding:clamp(20px,2.4vw,28px);display:flex;flex-direction:column;gap:8px\">\n        <dt style=\"font-size:14px;color:#C3CDDB\">RedlineMD review<\u002Fdt>\n        <dd style=\"margin:0;font-size:clamp(34px,3.6vw,44px);font-weight:600;letter-spacing:-0.035em;line-height:1\">$199<\u002Fdd>\n      <\u002Fdiv>\n      <div style=\"background:#172B46;padding:clamp(20px,2.4vw,28px);display:flex;flex-direction:column;gap:8px\">\n        <dt style=\"font-size:14px;color:#C3CDDB\">Traditional legal review<\u00 If Physician\\'s employment ends for any reason before the third anniversary, Physician shall repay a prorated portion of the Signing Bonus, unless Employer terminates without cause.' }\n];\n\nclass Component extends DCLogic {\n  state = { sel: 0, bar: false, file: null, drag: false };\n  heroCtaRef = React.createRef();\n  finalRef = React.createRef();\n  componentDidMount() {\n    const a0 = this.heroCtaRef.current;\n    const win = (a0 && a0.ownerDocument.defaultView) || window;\n    this.win = win;\n    this.onScroll = () => {\n      const a = this.heroCtaRef.current, b = this.finalRef.current;\n      if (!a || !b) return;\n      const bar = a.getBoundingClientRect().bottom < 60 && b.getBoundingClientRect().top > win.innerHeight - 40;\n      if (bar !== this.state.bar) this.setState({ bar });\n    };\n    win.addEventListener('scroll', this.onScroll, { passive: true });\n    win.addEventListener('resize', this.onScroll);\n    this.onScroll();\n  }\n  componentWillUnmount() {\n    this.win.removeEventListener('scroll', this.onScroll);\n    this.win.removeEventListener('resize', this.onScroll);\n  }\n  go(i) { this.setState({ sel: (i + FINDINGS.length) % FINDINGS.length }); }\n  renderVals() {\n    const { sel, bar, file, drag } = this.state;\n    const sevStyle = f => f.sev === 'High'\n      ? { sevBg: '#FCE8E8', sevColor: '#B0232A', dot: '#D42A2F', line: '#E7A3A3', tint: '#FDF3F3' }\n      : { sevBg: '#FFF1CF', sevColor: '#8A5A00', dot: '#D9A026', line: '#EBCB7E', tint: '#FFF9EA' };\n    const findings = FINDINGS.map((f, i) => {\n      const selected = i === sel, s = sevStyle(f);\n      return {\n        ...f, ...s, selected,\n        onClick: () => this.go(i),\n        bg: selected ? '#F7F9FC' : '#FFFFFF',\n        border: selected ? '#172B46' : '#E4E9F0',\n        chipBg: selected ? '#172B46' : '#FFFFFF',\n        chipFg: selected ? '#FFFFFF' : '#17243A',\n        chipBorder: selected ? '#172B46' : '#CBD4E1',\n        docBg: selected ? s.tint : 'transparent',\n        segs: f.segs.map(([t, text]) => ({\n          t: text, plain: t === 'k',\n          flag: t === 'd' && !selected, del: t === 'd' && selected, ins: t === 'i' && selected\n        }))\n      };\n    });\n    const c = FINDINGS[sel], cs = sevStyle(c);\n    const cur = { ...c, ...cs, docBg: cs.tint,\n      segs: c.segs.map(([t, text]) => ({ t: text, plain: t === 'k', del: t === 'd', ins: t === 'i' })) };\n    const pick = f => { if (f) this.setState({ file: f.name, drag: false }); };\n    return {\n      ctaUrl: this.props.ctaUrl || 'https://redlinemd.ai',\n      heroCtaRef: this.heroCtaRef, finalRef: this.finalRef,\n      findings, cur, count: FINDINGS.length, pos: sel + 1,\n      prev: () => this.go(sel - 1), next: () => this.go(sel + 1),\n      barTransform: bar ? 'translateY(0)' : 'translateY(110%)',\n      barHidden: bar ? 'false' : 'true', barTab: bar ? 0 : -1,\n      noFile: !file, hasFile: !!file, fileName: file || '',\n      dropBorder: drag ? '#172B46' : file ? '#7FBF9B' : '#CBD4E1',\n      dropBg: drag ? '#EEF2F6' : file ? '#F1FAF4' : '#F7F9FC',\n      dropIcon: file ? '#17703F' : '#172B46',\n      onFile: e => pick(e.target.files && e.target.files[0]),\n      onDragOver: e => { e.preventDefault(); if (!drag) this.setState({ drag: true }); },\n      onDragLeave: () => this.setState({ drag: false }),\n      onDrop: e => { e.preventDefault(); pick(e.dataTransfer.files && e.dataTransfer.files[0]); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
